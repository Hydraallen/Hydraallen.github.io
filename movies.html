<!DOCTYPE html>
<html lang="en" data-i18n-title="meta.title.movies">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies | Hydraallen</title>
  <meta name="description" data-i18n-attr="content:meta.description.movies"
    content="A visual timeline of the movies Hydraallen has watched over the years, organized by year with favorites highlighted.">
  <meta property="og:title" content="Movies | Hydraallen">
  <meta property="og:description"
    content="Explore Hydraallen's movie-watching journey as an interactive year-by-year timeline.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hydraallen.github.io/movies.html">
  <meta property="og:image" content="https://hydraallen.github.io/img/avatar.jpg">
  <link rel="stylesheet" href="css/html5reset.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/styles_movies.css">
  <link rel="alternate" hreflang="en" href="https://hydraallen.github.io/movies.html?lang=en">
  <link rel="alternate" hreflang="zh-Hans" href="https://hydraallen.github.io/movies.html?lang=zh">
  <link rel="alternate" hreflang="x-default" href="https://hydraallen.github.io/movies.html">
  <link rel="stylesheet" href="css/styles_i18n.css">
  <!-- i18n runtime + strings: synchronous in <head> so the language is applied before first paint -->
  <script src="js/i18n.js"></script>
  <script src="js/i18n/strings.common.js"></script>
  <script src="js/i18n/strings.misc.js"></script>
</head>

<body>
  <div class="skip"><a href="#main-content" data-i18n="common.skip">Skip to Main Content</a></div>

  <header class="movie-header">
    <div class="hamburger-menu-wrapper">
      <p class="logo">Hydraallen</p>
      <button class="hamburger-menu" aria-label="Toggle navigation" data-i18n-attr="aria-label:nav.toggle" aria-expanded="false"
        aria-controls="primary-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <h1><span data-i18n="movies.hero.my">My</span> <strong data-i18n="movies.hero.title">Movie Journey</strong></h1>
    <p class="intro">
      <span data-i18n="movies.hero.intro_1">A visual timeline of the movies I've watched.</span>
      <br><span data-i18n="movies.hero.intro_2">Click on a year to view the collection.</span>
    </p>

    <div class="cv-container">
      <a href="index.html" class="cv-btn">
        <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="" aria-hidden="true" class="cv-icon">
        <span data-i18n="common.back_home">Back to Home</span>
      </a>
    </div>
  </header>

  <!-- Primary navigation is injected here by js/nav.js (single source of truth) -->
  <div id="nav-placeholder"></div>

  <main id="main-content">
    <section id="movie-timeline">
      <h2 data-i18n="movies.heading">Watch History</h2>
      <!-- Timeline is rendered from data/movies/*.json by loadMovies() in js/scripts.js -->
      <div class="timeline-container" id="timeline-root" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>
      &copy; <span data-i18n="footer.copyright_prefix">Copyrights</span> <span id="year"></span>
      <span data-i18n="footer.copyright_suffix">by Hydraallen. All rights reserved.</span>
    </p>
  </footer>
  <script src="js/lib.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/scripts.js"></script>
</body>

</html>
