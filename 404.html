<!DOCTYPE html>
<html lang="en" data-i18n-title="meta.title.404">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Hydraallen</title>
  <meta name="description" data-i18n-attr="content:meta.description.404"
    content="The page you were looking for on Hydraallen's site could not be found. Head back to the home page to continue exploring.">
  <meta property="og:title" content="Page Not Found | Hydraallen">
  <meta property="og:description"
    content="404 - This page does not exist on Hydraallen's site. Return to the home page.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hydraallen.github.io/404.html">
  <meta property="og:image" content="https://hydraallen.github.io/img/avatar.jpg">
  <link rel="stylesheet" href="css/html5reset.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/styles_i18n.css">
  <!-- i18n runtime + strings: synchronous in <head> so the language is applied before first paint -->
  <script src="js/i18n.js"></script>
  <script src="js/i18n/strings.common.js"></script>
  <script src="js/i18n/strings.misc.js"></script>
</head>

<body>
  <div class="skip"><a href="#main-content" data-i18n="common.skip">Skip to Main Content</a></div>

  <header class="minimal-header">
    <div class="hamburger-menu-wrapper">
      <p class="logo">Hydraallen</p>
      <button class="hamburger-menu" aria-label="Toggle navigation" data-i18n-attr="aria-label:nav.toggle" aria-expanded="false"
        aria-controls="primary-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Primary navigation is injected here by js/nav.js (single source of truth) -->
  <div id="nav-placeholder"></div>

  <main id="main-content">
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 data-i18n="notfound.title">Page Not Found</h1>
      <p>
        <span data-i18n="notfound.body_1">Oops! It looks like you've ventured into uncharted territory.</span> <br>
        <span data-i18n="notfound.body_2">The page you are looking for might have been removed or is temporarily unavailable.</span>
      </p>

      <a href="index.html" class="btn home-btn">
        <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="" aria-hidden="true"
          class="btn-icon btn-icon-sm">
        <span data-i18n="common.back_home">Back to Home</span>
      </a>
    </div>
  </main>

  <footer>
    <p>
      &copy; <span data-i18n="footer.copyright_prefix">Copyrights</span> <span id="year"></span>
      <span data-i18n="footer.copyright_suffix">by Hydraallen. All rights reserved.</span>
    </p>
  </footer>

  <script src="js/lib.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/scripts.js"></script>
</body>

</html>
