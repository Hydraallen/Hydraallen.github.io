<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel | Hydraallen</title>
  <meta name="description"
    content="Explore Hydraallen's travel journey through an interactive world map and photo galleries capturing places visited across every continent.">
  <meta property="og:title" content="Travel | Hydraallen">
  <meta property="og:description"
    content="An interactive map and photo gallery of Hydraallen's travels around the world.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hydraallen.github.io/travel.html">
  <meta property="og:image" content="https://hydraallen.github.io/img/avatar.jpg">
  <link rel="stylesheet" href="css/html5reset.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/styles_travel.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
  <div class="skip"><a href="#main-content">Skip to Main Content</a></div>

  <header class="movie-header">
    <div class="hamburger-menu-wrapper">
      <p class="logo">Hydraallen</p>
      <button class="hamburger-menu" aria-label="Toggle navigation" aria-expanded="false"
        aria-controls="primary-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <h1>My <strong>Travel Journey</strong></h1>
    <p class="intro">
      Using image and video to defeat time.
      <br>Explore the world through my lens.
    </p>

    <div class="cv-container">
      <a href="index.html" class="cv-btn">
        <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="" aria-hidden="true" class="cv-icon">
        <span>Back to Home</span>
      </a>
    </div>
  </header>

  <!-- Primary navigation is injected here by js/nav.js (single source of truth) -->
  <div id="nav-placeholder"></div>

  <main id="main-content">
    <section id="travel-gallery">
      <h2>Travel Journey</h2>

      <!-- 2. 地图容器 -->
      <div class="map-wrapper" style="position: relative;">
        <div id="map-container"></div>
        <!-- 返回世界地图按钮 (默认隐藏) -->
        <button id="reset-map-btn" class="map-reset-btn hidden-btn">
          ← Back to World Map
        </button>
      </div>

      <!-- 3. 大洲筛选 Tab -->
      <div class="continent-tabs" role="tablist" aria-label="Filter places by continent">
        <button class="tab-btn active" type="button" role="tab" aria-selected="true"
          data-continent="all">All World</button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false"
          data-continent="asia">Asia</button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false"
          data-continent="europe">Europe</button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false"
          data-continent="namerica">North America</button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false"
          data-continent="samerica">South America</button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false"
          data-continent="africa">Africa</button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false"
          data-continent="oceania">Oceania</button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false"
          data-continent="antarctica">Antarctica</button>
      </div>

      <!-- 4. 控制区域 -->
      <div class="travel-controls">
        <div class="dropdown-group">
          <div class="control-item">
            <label for="place-sort">Sort by</label>
            <div class="select-wrapper">
              <select id="place-sort">
                <option value="newest">Date (Newest)</option>
                <option value="oldest">Date (Oldest)</option>
                <option value="az">Name (A-Z)</option>
                <!-- 新增 Z-A 选项 -->
                <option value="za">Name (Z-A)</option>
              </select>
            </div>
          </div>
          <div class="control-item">
            <label for="lang-select">Map Language</label>
            <div class="select-wrapper">
              <select id="lang-select">
                <option value="en" selected>English</option>
                <option value="cn">中文 (Chinese)</option>
                <option value="local">Original (Local)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="filter-toggles">
          <label class="toggle-btn visited-toggle">
            <input type="checkbox" id="filter-visited" checked>
            <span class="toggle-icon">●</span> Visited
          </label>
          <label class="toggle-btn planned-toggle">
            <input type="checkbox" id="filter-planned" checked>
            <span class="toggle-icon">●</span> TODO List
          </label>
        </div>
      </div>

      <!-- 主容器：JS 将在这里动态生成两个区域 -->
      <div id="travel-grid" aria-live="polite">
        <p class="loading-text">Loading world map & memories...</p>
      </div>
    </section>
  </main>

  <!-- Gallery Modal -->
  <div id="gallery-modal" class="gallery-modal hidden-modal">
    <div class="gallery-content">
      <div class="gallery-header">
        <div class="header-left">
          <button id="close-gallery" class="back-btn">← Back</button>
        </div>
        <div class="header-center">
          <h2 id="gallery-title">City Name</h2>
          <a id="gallery-video-btn" href="#" target="_blank" rel="noopener noreferrer"
            class="video-btn hidden-btn">
            ▶ Watch Video
          </a>
        </div>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </div>

  <!-- Lightbox (Updated Structure) -->
  <div id="lightbox" class="lightbox hidden-modal">
    <button id="close-lightbox" type="button" class="close-lightbox" aria-label="Close">&times;</button>
    <button id="prev-btn" type="button" class="lightbox-btn prev-btn" aria-label="Previous photo">&#10094;</button>
    <button id="next-btn" type="button" class="lightbox-btn next-btn" aria-label="Next photo">&#10095;</button>
    
    <!-- 新增容器，用于包裹图片和文字 -->
    <div class="lightbox-container">
      <img class="lightbox-content" id="lightbox-img" alt="Travel Photo" src="./img/avatar.jpg">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <footer>
    <p>
      &copy; Copyrights <span id="year"></span> by Hydraallen. All rights
      reserved.
    </p>
  </footer>
  <script src="js/lib.js"></script>
  <script src="js/nav.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/scripts_travel.js"></script>
  <script src="js/scripts.js"></script>
</body>

</html>
