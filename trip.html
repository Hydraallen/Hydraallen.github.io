<!DOCTYPE html>
<html lang="en" data-i18n-title="meta.title.trip">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip | Hydraallen</title>
  <meta name="description" data-i18n-attr="content:meta.description.trip"
    content="A day-by-day trip journal from Hydraallen's travels: itinerary, route map and photos for a single destination.">
  <meta property="og:title" content="Trip | Hydraallen">
  <meta property="og:description"
    content="Day-by-day itinerary, route map and photo wall for a single destination.">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://hydraallen.github.io/trip.html">
  <meta property="og:image" content="https://hydraallen.github.io/img/avatar.jpg">
  <link rel="stylesheet" href="css/html5reset.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/styles_travel.css">
  <link rel="stylesheet" href="css/styles_trip.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="alternate" hreflang="en" href="https://hydraallen.github.io/trip.html?lang=en">
  <link rel="alternate" hreflang="zh-Hans" href="https://hydraallen.github.io/trip.html?lang=zh">
  <link rel="alternate" hreflang="x-default" href="https://hydraallen.github.io/trip.html">
  <link rel="stylesheet" href="css/styles_i18n.css">
  <!-- i18n runtime + strings: synchronous in <head> so the language is applied before first paint -->
  <script src="js/i18n.js"></script>
  <script src="js/i18n/strings.common.js"></script>
  <script src="js/i18n/strings.travel.js"></script>
</head>

<body>
  <div class="skip"><a href="#main-content" data-i18n="common.skip">Skip to Main Content</a></div>

  <header>
    <div class="hamburger-menu-wrapper">
      <p class="logo">Hydraallen</p>
      <button class="hamburger-menu" aria-label="Toggle navigation" data-i18n-attr="aria-label:nav.toggle" aria-expanded="false"
        aria-controls="primary-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <h1><span data-i18n="trip.hero.trip">Trip</span> <strong data-i18n="trip.hero.journal">Journal</strong></h1>
    <p class="intro">
      <span data-i18n="trip.hero.intro_1">One destination, day by day.</span>
      <br><span data-i18n="trip.hero.intro_2">Where I went, what I ate, what I shot.</span>
    </p>

    <div class="cv-container">
      <a href="index.html" class="cv-btn">
        <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="" aria-hidden="true" class="cv-icon">
        <span data-i18n="common.back_home">Back to Home</span>
      </a>
    </div>
  </header>

  <!-- Primary navigation is injected here by js/nav.js (single source of truth) -->
  <div id="nav-placeholder"></div>

  <main id="main-content">
    <a class="trip-back" href="travel.html" data-i18n="trip.back">← All destinations</a>

    <!-- 行程详情主体：全部内容由 js/scripts_trip.js 在运行时从 JSON 渲染 -->
    <section id="trip-page" class="trip-page">
      <div class="trip-hero">
        <img class="trip-hero-cover" src="" alt="" loading="lazy">
        <div class="trip-hero-body">
          <p class="trip-country"></p>
          <h2 class="trip-place"></h2>
          <p class="trip-dates"></p>
          <p class="trip-summary"></p>
          <a class="trip-video-btn hidden-btn" href="#" target="_blank" rel="noopener noreferrer" data-i18n="trip.watch_video">▶ Watch Video</a>
        </div>
      </div>

      <!-- 每日路线地图 -->
      <div class="trip-map-wrapper">
        <div id="trip-map"></div>
      </div>

      <!-- 逐日行程 -->
      <div id="trip-itinerary" class="trip-itinerary"></div>

      <!-- 照片墙 -->
      <h3 class="trip-section-heading" data-i18n="trip.photos">Photos</h3>
      <div id="trip-photo-wall" class="trip-photo-wall"></div>
    </section>

    <p id="trip-error" class="trip-error hidden-btn"></p>
  </main>

  <!-- Lightbox (shares the markup and styles of the travel page) -->
  <div id="lightbox" class="lightbox hidden-modal">
    <button id="close-lightbox" type="button" class="close-lightbox" aria-label="Close" data-i18n-attr="aria-label:common.close">&times;</button>
    <button id="prev-btn" type="button" class="lightbox-btn prev-btn" aria-label="Previous photo" data-i18n-attr="aria-label:travel.lightbox.prev">&#10094;</button>
    <button id="next-btn" type="button" class="lightbox-btn next-btn" aria-label="Next photo" data-i18n-attr="aria-label:travel.lightbox.next">&#10095;</button>

    <div class="lightbox-container">
      <img class="lightbox-content" id="lightbox-img" alt="Travel Photo" data-i18n-attr="alt:travel.lightbox.photo_alt" src="./img/avatar.jpg">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <footer>
    <p>
      &copy; <span data-i18n="footer.copyright_prefix">Copyrights</span> <span id="year"></span>
      <span data-i18n="footer.copyright_suffix">by Hydraallen. All rights reserved.</span>
    </p>
  </footer>
  <script src="js/lib.js"></script>
  <script src="js/nav.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/scripts_trip.js"></script>
  <script src="js/scripts.js"></script>
</body>

</html>
